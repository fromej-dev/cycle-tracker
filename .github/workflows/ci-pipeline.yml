name: CI/CD Pipeline

on:
  push:
    tags: # Also trigger on tags for releases
      - 'v*.*.*' # Example: Trigger on tags like v1.0.0
  pull_request:
  workflow_dispatch:
  

jobs:
  helm_lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.10.0 # Specify a Helm version, adjust if needed

      - name: Run helm lint
        # Optional: Add conditional execution based on file changes if desired
        # The chart refuses to render without secrets; lint with a placeholder Secret name.
        run: helm lint ./cycle-tracker --set secrets.existingSecret=lint-placeholder

  python_lint_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies with uv sync
        run: uv sync

      - name: Run ruff linter
        run: uv run ruff check .

      - name: Run ruff formatter
        run: uv run ruff format --check .

      - name: Run pytest
        run: uv run pytest

  build_and_push_backend_image:
    runs-on: ubuntu-latest
    needs: python_lint_test
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set image tag for deployment
        id: set_tag
        run: |
          # Extract the first tag from the metadata action
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1 | cut -d':' -f2)
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Using image tag: $IMAGE_TAG"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_chart:
    runs-on: github-runner-homelab
    needs: build_and_push_backend_image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    env:
      RELEASE_NAME: cycle-tracker-backend
      NAMESPACE: default

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
           fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.10.0

      - name: Deploy Helm chart
        run: |
          IMAGE_TAG="${{ needs.build_and_push_backend_image.outputs.image_tag }}"
          echo "Deploying with image tag: $IMAGE_TAG"

          helm upgrade --install \
            ${{ env.RELEASE_NAME }} \
            ./cycle-tracker \
            --namespace cycle-tracker \
            --create-namespace \
            --set image.repository=ghcr.io/${{ github.repository }} \
            --set image.tag=$IMAGE_TAG \
            --wait
