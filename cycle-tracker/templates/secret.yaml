{{- if and (not .Values.secrets.existingSecret) .Values.secrets.secretKey .Values.secrets.jwtSecretKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cycle-tracker.fullname" . }}
  labels:
    {{- include "cycle-tracker.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.secretKey }}: {{ .Values.secrets.secretKey | quote }}
  {{ .Values.secrets.keys.jwtSecretKey }}: {{ .Values.secrets.jwtSecretKey | quote }}
{{- end }}
